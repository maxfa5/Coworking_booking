name: Deploy backend

on:
  push:
    branches: [main]

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add Known Hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Pull and rebuild
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" bash -s << 'EOF'
          set -euo pipefail
          echo "--- Starting deployment ---"
          
          # Обновляем код
          git -C /var/www/Coworking_booking pull --ff-only origin main
          
          # Переходим в папку с docker-compose (убедитесь, что он там лежит!)
          cd /root
          
          # Пересобираем и поднимаем контейнер
          docker compose build coworking-app
          docker compose up -d coworking-app
          
          # Выполняем миграции и кэширование
          docker exec coworking-app php artisan migrate --force
          docker exec coworking-app php artisan config:cache
          docker exec coworking-app php artisan route:cache
          
          echo "--- Deployment finished successfully ---"
          EOF