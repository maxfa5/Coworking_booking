name: Deploy backend

on:
  push:
    branches: [main]

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          # Сохраняем ключ (printf отлично работает с многострочным текстом)
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          
          # Убираем возможные символы \r (Windows), если ключ копировали из Windows
          sed -i 's/\r$//' ~/.ssh/id_ed25519
          
          chmod 600 ~/.ssh/id_ed25519
          
          # Проверка, что ключ читается (выведет публичный ключ, приватный не светит)
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Pull and rebuild
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" bash -s << 'EOF'
          set -euo pipefail
          
          echo "--- Starting deployment ---"
          
          # Обновляем код
          git -C /var/www/Coworking_booking pull --ff-only origin main
          
          # Переходим в папку с docker-compose (убедитесь, что он там лежит!)
          cd /root
          
          # Пересобираем и поднимаем контейнер
          docker compose build coworking-app
          docker compose up -d coworking-app
          
          # Выполняем миграции и кэширование
          docker exec coworking-app php artisan migrate --force
          docker exec coworking-app php artisan config:cache
          docker exec coworking-app php artisan route:cache
          
          echo "--- Deployment finished successfully ---"
          EOF